{% extends "base.html" %}

{% block title %}Customer Pricing Overrides{% endblock %}

{% block content %}
<div class="container-fluid px-2 px-md-3">
    <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
        <h2>Customer Pricing Overrides</h2>
        <button class="btn btn-primary" id="refreshBtn" onclick="loadData()">Refresh</button>
    </div>

    <div class="card">
        <div class="card-header">
            <h5>Price Overrides</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Customer</th>
                            <th>Product</th>
                            <th>Override Price</th>
                            <th>Min Qty</th>
                            <th>Valid Period</th>
                            <th>Reason</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="6" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
function loadData() {
    fetch('/api/crm/customer-pricing')
        .then(response => response.json())
        .then(data => {
            var tbody = document.getElementById('tableBody');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">No data found</td></tr>';
                return;
            }
            
            var html = '';
            for (var i = 0; i < data.length; i++) {
                var item = data[i];
                var fromDate = item.valid_from_date_key ? 
                    String(item.valid_from_date_key).slice(0,4) + '-' + String(item.valid_from_date_key).slice(4,6) + '-' + String(item.valid_from_date_key).slice(6,8) : 'Any';
                var toDate = item.valid_to_date_key ? 
                    String(item.valid_to_date_key).slice(0,4) + '-' + String(item.valid_to_date_key).slice(4,6) + '-' + String(item.valid_to_date_key).slice(6,8) : 'Any';
                
                html += '<tr>' +
                    '<td>' + (item.customer_name || item.customer_id) + '</td>' +
                    '<td>' + (item.product_id || '') + (item.product_name ? ' - ' + item.product_name : '') + '</td>' +
                    '<td>$' + (item.override_price || 0).toLocaleString() + '</td>' +
                    '<td>' + (item.min_order_qty || 1) + '</td>' +
                    '<td>' + fromDate + ' → ' + toDate + '</td>' +
                    '<td>' + (item.reason || '') + '</td>' +
                '</tr>';
            }
            tbody.innerHTML = html;
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Error loading data</td></tr>';
        });
}

loadData();
</script>
{% endblock %}
